name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ci:
    timeout-minutes: 150
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: default-tools
      labels: arc-light
    strategy:
      matrix:
        os: [linux]

    steps:
      - uses: actions/checkout@v2
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.toml', '.github/workflows/*.yml', 'rust-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - uses: actions-rs/toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Non ASCII characters
        if: matrix.os == 'linux'
        run: |
          if grep -P -n "[^\x00-\x7F]" -r --include="*.rs" --include="*.toml" .; then
          echo "Non-ASCII characters detected"
          exit 1
          fi

      - name: Install cargo-deny
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: rustup run --install 1.85 cargo install --force --version 0.16.2 cargo-deny --locked

      - name: Install just
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: rustup run --install 1.85 cargo install --force --version 1.36.0 just --locked

      - name: Clippy
        run: cargo clippy --all --all-targets -- -Dwarnings

      - name: Format
        run: cargo fmt --all -- --check

      - name: Run tests
        run: just test

      # FULL (`!cfg!(debug_assertions)`) runs only optimized: the production
      # sizes, the sparse-solver K and the K=256 in-place encoder cases.
      - name: Run reusable codec tests (release)
        run: cargo test --release --test reusable_codec --test reusable_alloc --test object_encoder

      - name: Run object encoder tests (release, no-std)
        run: cargo test --release --no-default-features --test object_encoder

      - name: Compile benchmarks
        run: cargo bench --features benchmarking --no-run

      - name: Run tests (no-std)
        run: cargo test --no-default-features

      - name: Run CPython wrapper tests
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip3 install --upgrade pip
          pip3 install maturin
          just test_py

      - name: Save Rust cache
        if: ${{ success() && steps.rust-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'schedule') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
